<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sevkiyat Koli Etiketi Oluşturucu</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <style>
        @page {
            margin: 0;
        }
        @media print {
            body { 
                background: white; 
                padding: 1.5cm; 
            }
            .no-print { 
                display: none !important; 
            }
            .page-break { 
                page-break-after: always; 
                break-after: page; 
            }
            .label-card { 
                border: 2px solid #000 !important; 
                box-shadow: none !important; 
                margin-bottom: 0 !important; 
            }
        }
    </style>
</head>
<body class="bg-slate-100 min-h-screen text-slate-800 font-sans p-4 md:p-8">

    <div class="max-w-5xl mx-auto no-print">
        <div class="bg-white rounded-xl shadow-md p-6 mb-6 border border-slate-200">
            <h1 class="text-2xl font-bold text-slate-900 flex items-center gap-2">
                📦 Sevkiyat Koli Etiket Otomasyonu
            </h1>
            <p class="text-slate-600 mt-1">
                Çeki listesi Excel dosyanızı yükleyin, hedef ülkeyi ve varsa ithalatçı logosunu (.png) seçin.
            </p>
        </div>

        <div class="bg-white rounded-xl shadow-md p-6 mb-8 border border-slate-200 grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-4">
            <div>
                <label class="block text-sm font-semibold text-slate-700 mb-2">Hedef Ülke Seçin</label>
                <select id="countrySelect" class="block w-full text-sm text-slate-700 bg-white border border-slate-300 rounded-lg p-2.5 font-medium focus:ring-blue-500 focus:border-blue-500">
                    <option value="egypt" selected>Mısır</option>
                    <option value="lebanon">Lübnan</option>
                </select>
            </div>

            <div>
                <label class="block text-sm font-semibold text-slate-700 mb-2">Excel Çeki Listesi (.xlsx, .xls)</label>
                <input type="file" id="excelFile" accept=".xlsx, .xls" 
                    class="block w-full text-sm text-slate-500 file:mr-2 file:py-2 file:px-3 file:rounded-lg file:border-0 file:text-xs file:font-semibold file:bg-blue-50 file:text-blue-700 hover:file:bg-blue-100 cursor-pointer border border-slate-300 rounded-lg">
            </div>

            <div>
                <label class="block text-sm font-semibold text-slate-700 mb-2">İthalatçı Görseli / PNG (Opsiyonel)</label>
                <input type="file" id="imageFile" accept="image/png, image/jpeg, image/webp" 
                    class="block w-full text-sm text-slate-500 file:mr-2 file:py-2 file:px-3 file:rounded-lg file:border-0 file:text-xs file:font-semibold file:bg-slate-100 file:text-slate-700 hover:file:bg-slate-200 cursor-pointer border border-slate-300 rounded-lg">
            </div>

            <div class="flex items-end gap-2">
                <button onclick="processExcel()" class="bg-blue-600 hover:bg-blue-700 text-white font-medium py-2.5 px-4 rounded-lg transition-colors shadow-sm w-full">
                    🚀 Etiket Oluştur
                </button>
                <button onclick="window.print()" id="btnPrint" class="hidden bg-emerald-600 hover:bg-emerald-700 text-white font-medium py-2.5 px-4 rounded-lg transition-colors shadow-sm flex items-center justify-center gap-1">
                    🖨️ Yazdır
                </button>
            </div>
        </div>

        <!-- Belirgin ve İtalik İmza Alanı -->
       
    </div>

    <div id="labelsContainer" class="max-w-4xl mx-auto space-y-8"></div>

    <script>
        const arabicDict = {
            'turkey': 'تركيا',
            'türkiye': 'تركيا',
            'tr': 'تركيا',
            'china': 'الصين',
            'cn': 'الصين',
            'egypt': 'مصر',
            'eg': 'مصر',
            'india': 'الهند',
            'in': 'الهند',
            'bangladesh': 'بنغلاديش',
            'bd': 'بنغلاديش',
            'pakistan': 'باكستان',
            'pk': 'باكستان',
            'vietnam': 'فيتنام',
            'vn': 'فيتنام',
            'italy': 'إيطاليا',
            'spain': 'إسبانيا',
            'portugal': 'البرتغال',
            'morocco': 'المغرب',
            'tunisia': 'تونس',
            'textile': 'المنسوجات',
            'tekstil': 'المنسوجات',
            'apparel': 'الملابس',
            'garment': 'الملابس',
            'clothing': 'الملابس',
            'giyim': 'الملابس',
            'fabric': 'القماش',
            'kumaş': 'القماش',
            'accessory': 'الإكسسوارات',
            'accesory': 'الإكسسوارات',
            'accessories': 'الإكسسوارات',
            'aksesuar': 'الإكسسوارات',
            'shoe': 'الأحدية',
            'shoes': 'الأحدية',
            'footwear': 'الأحدية',
            'ayakkabı': 'الأحدية',
            'bag': 'الحقائب',
            'bags': 'الحقائب',
            'çanta': 'الحقائب',
            'belt': 'الأحزمة',
            'kemer': 'الأحزمة',
            'non-commercial': 'غير تجاري',
            'non commercial': 'غير تجاري',
            'non-commercıal': 'غير تجاري',
            'non commercıal': 'غير تجاري',
            'ticari olmayan': 'غير تجاري'
        };

        function getOrdinalSuffix(numStr) {
            let n = parseInt(numStr, 10);
            if (isNaN(n)) return 'TH';
            
            let mod100 = n % 100;
            if (mod100 >= 11 && mod100 <= 13) {
                return 'TH';
            }
            
            switch (n % 10) {
                case 1: return 'ST';
                case 2: return 'ND';
                case 3: return 'RD';
                default: return 'TH';
            }
        }

        function getWithArabic(value, type) {
            let strVal = String(value || '').trim();
            if (!strVal) return '';
            if (/[\u0600-\u06FF]/.test(strVal)) return strVal;

            let lowerVal = strVal.toLowerCase();

            if (arabicDict[lowerVal]) {
                return `${strVal} - ${arabicDict[lowerVal]}`;
            }

            let parts = strVal.split(/[\s,\-\/]+/);
            let translatedParts = [];
            let hasTranslation = false;

            parts.forEach(part => {
                let pLower = part.toLowerCase();
                if (arabicDict[pLower]) {
                    if (!translatedParts.includes(arabicDict[pLower])) {
                        translatedParts.push(arabicDict[pLower]);
                        hasTranslation = true;
                    }
                }
            });

            if (hasTranslation) {
                return `${strVal} - ${translatedParts.join(' - ')}`;
            }

            for (let key in arabicDict) {
                if (lowerVal.includes(key)) {
                    return `${strVal} - ${arabicDict[key]}`;
                }
            }

            return strVal;
        }

        function processExcel() {
            const fileInput = document.getElementById('excelFile');
            if (!fileInput.files.length) {
                alert('Lütfen önce bir Excel dosyası seçin!');
                return;
            }

            const imageInput = document.getElementById('imageFile');
            let base64Image = '';

            if (imageInput.files.length) {
                const imgReader = new FileReader();
                imgReader.onload = function(e) {
                    base64Image = e.target.result;
                    readAndGenerateExcel(fileInput.files[0], base64Image);
                };
                imgReader.readAsDataURL(imageInput.files[0]);
            } else {
                readAndGenerateExcel(fileInput.files[0], '');
            }
        }

        function readAndGenerateExcel(excelFile, imageSrc) {
            const reader = new FileReader();

            reader.onload = function(e) {
                try {
                    const data = new Uint8Array(e.target.result);
                    const workbook = XLSX.read(data, {type: 'array'});

                    let sheetName = workbook.SheetNames.find(s => s.toLowerCase().includes('sayfa2')) || workbook.SheetNames[0];
                    const worksheet = workbook.Sheets[sheetName];
                    
                    const rawJson = XLSX.utils.sheet_to_json(worksheet, {header: 1, defval: ""});

                    generateLabelsFromRaw(rawJson, imageSrc);
                } catch (err) {
                    alert('Excel okunurken bir hata oluştu: ' + err.message);
                }
            };

            reader.readAsArrayBuffer(excelFile);
        }

        function generateLabelsFromRaw(rows, imageSrc) {
            const container = document.getElementById('labelsContainer');
            container.innerHTML = '';

            const selectedCountry = document.getElementById('countrySelect').value;

            const imgHtml = imageSrc ? `<img src="${imageSrc}" class="max-h-12 object-contain ml-2 shrink-0" alt="Importer Logo">` : '';

            let importerHtml = '';
            if (selectedCountry === 'lebanon') {
                importerHtml = `
                    <div>
                        <p class="font-bold text-slate-900">Importer Name: FRANCHİSE RETAİL CONCEPT S.A.R.L</p>
                        <p>Galaxy Mall, Chiah, estate no: 1642/67B ,KOUSBA , LEBANON TAX NO: 2932926</p>
                    </div>
                `;
            } else {
                importerHtml = `
                    <div>
                        <p class="font-bold text-slate-900">Importer Name: Senwan Egypt for General Trading</p>
                        <p>8 Abdelhadi Sadek St., Off El Thawra St., Heliopolis, Cairo, Egypt TAX NO: 511 428 138</p>
                    </div>
                `;
            }

            let headerRowIndex = -1;
            let colMap = {};
            let globalShipmentNo = '';
            let globalShipmentName = '';

            for (let i = 0; i < rows.length; i++) {
                const row = rows[i];
                if (!row) continue;
                for (let j = 0; j < row.length; j++) {
                    const cellVal = String(row[j] || '').trim().toLowerCase();
                    if (cellVal.includes('product name') || cellVal.includes('carton no') || cellVal.includes('gross weight') || cellVal.includes('ürün adı')) {
                        headerRowIndex = i;
                        break;
                    }
                }
                if (headerRowIndex !== -1) break;
            }

            if (headerRowIndex === -1) {
                alert('Başlık satırı bulunamadı!');
                return;
            }

            const headerRow = rows[headerRowIndex];
            headerRow.forEach((colName, idx) => {
                const name = String(colName || '').trim().toLowerCase();
                if (name.includes('shipment name') || name.includes('sevkiyat adı') || name.includes('sevkiyat adi')) {
                    colMap['shipmentName'] = idx;
                } else if (name.includes('shipment') || name.includes('sevkiyat')) {
                    colMap['shipment'] = idx;
                } else if (name.includes('origin') || name.includes('menşei') || name.includes('mensei') || name.includes('country')) {
                    colMap['origin'] = idx;
                } else if (name.includes('product') || name.includes('ürün')) {
                    colMap['product'] = idx;
                } else if (name.includes('gross') || name.includes('brüt')) {
                    colMap['gross'] = idx;
                } else if (name.includes('net')) {
                    colMap['net'] = idx;
                } else if (name.includes('qty') || name.includes('quantity') || name.includes('adet')) {
                    colMap['qty'] = idx;
                } else if (name.includes('carton') || name.includes('koli')) {
                    colMap['carton'] = idx;
                } else if (name.includes('measure') || name.includes('ölçü')) {
                    colMap['measure'] = idx;
                }
            });

            if (colMap['origin'] === undefined) {
                alert('HATA: Excel sayfasında "Origin" / "Menşei" sütunu bulunamadı!');
                return;
            }

            if (colMap['shipment'] === undefined || colMap['shipmentName'] === undefined) {
                for (let i = 0; i < headerRowIndex; i++) {
                    const row = rows[i];
                    if (!row) continue;
                    for (let j = 0; j < row.length; j++) {
                        const cellVal = String(row[j] || '').trim();
                        const cellLower = cellVal.toLowerCase();

                        if (cellLower.includes('shipment name') || cellLower.includes('sevkiyat adı')) {
                            let val = (row[j + 1] && String(row[j + 1]).trim()) || (rows[i + 1] && rows[i + 1][j] && String(rows[i + 1][j]).trim()) || '';
                            if (val && !val.toLowerCase().includes('shipment')) globalShipmentName = val;
                        } else if (cellLower.includes('shipment') || cellLower.includes('sevkiyat')) {
                            const matchNum = cellVal.match(/\d+/);
                            if (matchNum) {
                                globalShipmentNo = matchNum[0];
                            } else {
                                let val = (row[j + 1] && String(row[j + 1]).trim()) || (rows[i + 1] && rows[i + 1][j] && String(rows[i + 1][j]).trim()) || '';
                                const valNum = val.match(/\d+/);
                                if (valNum) globalShipmentNo = valNum[0];
                                else if (val) globalShipmentNo = val;
                            }
                        }
                    }
                }
            }

            const dataRows = [];
            for (let i = headerRowIndex + 1; i < rows.length; i++) {
                const r = rows[i];
                if (!r) continue;
                const pName = colMap['product'] !== undefined ? r[colMap['product']] : '';
                const cNo = colMap['carton'] !== undefined ? r[colMap['carton']] : '';
                const gW = colMap['gross'] !== undefined ? r[colMap['gross']] : '';

                if ((pName !== '' && pName !== undefined) || (cNo !== '' && cNo !== undefined) || (gW !== '' && gW !== undefined)) {
                    dataRows.push(r);
                }
            }

            if (dataRows.length === 0) {
                alert('Veri satırları bulunamadı.');
                return;
            }

            const totalCartons = dataRows.length;

            for (let index = 0; index < dataRows.length; index++) {
                const row = dataRows[index];

                let sNo = (colMap['shipment'] !== undefined && row[colMap['shipment']] !== '' && row[colMap['shipment']] !== undefined)
                    ? String(row[colMap['shipment']]).trim()
                    : globalShipmentNo;

                let sName = (colMap['shipmentName'] !== undefined && row[colMap['shipmentName']] !== '' && row[colMap['shipmentName']] !== undefined)
                    ? String(row[colMap['shipmentName']]).trim()
                    : globalShipmentName;

                if (sNo.endsWith('.0')) sNo = sNo.replace('.0', '');

                let suffix = getOrdinalSuffix(sNo);
                let headerTitle = sNo ? `${sNo} ${suffix} SHIPMENT${sName ? ' - ' + sName : ''}` : (sName ? `SHIPMENT - ${sName}` : 'SHIPMENT');

                let rawOrigin = colMap['origin'] !== undefined && row[colMap['origin']] ? String(row[colMap['origin']]).trim() : '';
                
                if (!rawOrigin) {
                    alert(`HATA: ${index + 1}. satırdaki (Koli No: ${row[colMap['carton']] || (index + 1)}) koli için Menşei (Country of Origin) bilgisi bulunamadı! İşlem durduruldu.`);
                    container.innerHTML = '';
                    document.getElementById('btnPrint').classList.add('hidden');
                    return;
                }

                let originVal = getWithArabic(rawOrigin, 'origin');

                let rawProduct = colMap['product'] !== undefined ? row[colMap['product']] : '';
                let productName = getWithArabic(rawProduct, 'product') || 'TEXTILE - المنسوجات';
                
                let rawGross = colMap['gross'] !== undefined ? row[colMap['gross']] : '';
                let grossWeight = typeof rawGross === 'number' ? (rawGross >= 100 ? (rawGross / 1000).toFixed(3) + ' KG' : rawGross + ' KG') : (rawGross ? String(rawGross) : '0.000 KG');

                let rawNet = colMap['net'] !== undefined ? row[colMap['net']] : '';
                let netWeight = typeof rawNet === 'number' ? (rawNet >= 100 ? (rawNet / 1000).toFixed(3) + ' KG' : rawNet + ' KG') : (rawNet ? String(rawNet) : '0.000 KG');

                const qty = colMap['qty'] !== undefined && row[colMap['qty']] !== '' ? row[colMap['qty']] : '0';
                const cartonNo = colMap['carton'] !== undefined && row[colMap['carton']] !== '' ? row[colMap['carton']] : (index + 1);
                
                let rawMeasure = colMap['measure'] !== undefined ? String(row[colMap['measure']] || '').trim() : '40x60x40';
                const measurement = rawMeasure.replace(/x/gi, ' x ') + (rawMeasure.toLowerCase().includes('cm') ? '' : ' cm');

                const labelHtml = `
                    <div class="label-card bg-white rounded-xl shadow-lg border-2 border-slate-800 p-6 page-break">
                        <div class="text-center border-b-2 border-slate-800 pb-3 mb-4">
                            <h2 class="text-2xl font-black tracking-wide text-slate-900">${headerTitle}</h2>
                        </div>

                        <div class="text-xs text-slate-700 space-y-2 mb-6 border-b pb-4">
                            <div class="flex items-start justify-between gap-2">
                                <div>
                                    <p class="font-bold text-slate-900">Exporter Name: JK MAGAZACILIK TEKSTİL SANAYİ VE TİCARET A.Ş</p>
                                    <p>Yedi Eylül Mahallesi 35860 TORBALI / İzmir / Brand: JIMMY KEY TAX NO: 4840980538</p>
                                </div>
                                ${imgHtml}
                            </div>
                            <div class="pt-1">
                                ${importerHtml}
                            </div>
                        </div>

                        <div class="space-y-3 text-sm">
                            <div class="flex items-center justify-between border-b border-slate-200 pb-2">
                                <span class="font-bold text-slate-700 w-1/3">Country of Origin:</span>
                                <span class="font-semibold text-slate-900 w-1/3 text-center">${originVal}</span>
                                <span class="font-bold text-slate-700 w-1/3 text-right" dir="rtl">بلد المنشأ:</span>
                            </div>

                            <div class="flex items-center justify-between border-b border-slate-200 pb-2">
                                <span class="font-bold text-slate-700 w-1/3">Product Name:</span>
                                <span class="font-bold text-slate-900 w-1/3 text-center">${productName}</span>
                                <span class="font-bold text-slate-700 w-1/3 text-right" dir="rtl">اسم المنتج:</span>
                            </div>

                            <div class="flex items-center justify-between border-b border-slate-200 pb-2">
                                <span class="font-bold text-slate-700 w-1/3">Gross Weight:</span>
                                <span class="font-semibold text-slate-900 w-1/3 text-center">${grossWeight}</span>
                                <span class="font-bold text-slate-700 w-1/3 text-right" dir="rtl">الوزن الإجمالي:</span>
                            </div>

                            <div class="flex items-center justify-between border-b border-slate-200 pb-2">
                                <span class="font-bold text-slate-700 w-1/3">Net Weight:</span>
                                <span class="font-semibold text-slate-900 w-1/3 text-center">${netWeight}</span>
                                <span class="font-bold text-slate-700 w-1/3 text-right" dir="rtl">الوزن الصافي:</span>
                            </div>

                            <div class="flex items-center justify-between border-b border-slate-200 pb-2">
                                <span class="font-bold text-slate-700 w-1/3">Quantity:</span>
                                <span class="font-bold text-blue-700 text-base w-1/3 text-center">${qty}</span>
                                <span class="font-bold text-slate-700 w-1/3 text-right" dir="rtl">الكمية:</span>
                            </div>

                            <div class="flex items-center justify-between border-b border-slate-200 pb-2">
                                <span class="font-bold text-slate-700 w-1/3">Carton No:</span>
                                <span class="font-bold text-slate-900 text-base w-1/3 text-center">${cartonNo} / ${totalCartons}</span>
                                <span class="font-bold text-slate-700 w-1/3 text-right" dir="rtl">رقم الصندوق:</span>
                            </div>

                            <div class="flex items-center justify-between pt-1">
                                <span class="font-bold text-slate-700 w-1/3">Measurement:</span>
                                <span class="font-semibold text-slate-900 w-1/3 text-center">${measurement}</span>
                                <span class="font-bold text-slate-700 w-1/3 text-right" dir="rtl">القياسات:</span>
                            </div>
                        </div>
                    </div>
                `;
                container.innerHTML += labelHtml;
            }

            document.getElementById('btnPrint').classList.remove('hidden');
        }
    </script>
</body>
</html>
